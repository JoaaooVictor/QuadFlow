name: QuadFlow CI
on:
  push:
    branches:
      - master
jobs: 
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore QuadFlow.slnx

      - name: Build
        run: dotnet build QuadFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test QuadFlow.slnx --no-build --configuration Release